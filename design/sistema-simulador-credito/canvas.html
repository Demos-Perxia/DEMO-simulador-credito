<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canvas · Sistema Cuota Clara</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#101827;font-family:Manrope,Arial,sans-serif}#toolbar{position:fixed;top:16px;left:16px;z-index:10;display:flex;align-items:center;gap:8px;background:#172033;border:1px solid #344057;border-radius:999px;padding:8px 14px;color:#fff}.brand{font-size:12px;font-weight:800;letter-spacing:.12em;padding-right:10px;border-right:1px solid #344057}.brand b{color:#35c78c}button{background:none;border:1px solid #344057;color:#fff;border-radius:999px;width:28px;height:28px;cursor:pointer}button.wide{width:auto;padding:0 12px;font-size:11px;font-weight:700}#zoom-label{font-size:11px;color:#b9c4d7;min-width:40px;text-align:center}#viewport{position:absolute;inset:0;cursor:grab}#viewport.panning{cursor:grabbing}#world{position:absolute;transform-origin:0 0}.artboard{position:absolute;display:flex;flex-direction:column;gap:8px}.title{font:600 12px 'DM Mono',monospace;color:#b9c4d7;letter-spacing:.04em}.frame{box-shadow:0 12px 40px rgba(0,0,0,.45);background:#fff}.frame iframe{border:1px solid #344057;border-radius:4px;background:#fff;width:100%;height:100%;display:block}.hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:11px;color:#71809a}</style></head><body><div id="toolbar"><span class="brand">CUOTA <b>CLARA</b> · DESIGN SYSTEM</span><button id="zoom-out">−</button><span id="zoom-label">100%</span><button id="zoom-in">+</button><button id="zoom-fit" class="wide">Ajustar</button><button id="zoom-100" class="wide">100%</button></div><div id="viewport"><div id="world"></div></div><div class="hint">Arrastra para moverte · rueda para desplazarte · doble clic para abrir un artboard</div><script>const TITLE='Canvas · Sistema visual Cuota Clara';const ARTBOARDS=[{src:'./artboards/Simulador.html',title:'Mockup · Simulador de libranza',x:0,y:0,w:1200,h:1500},{src:'./artboards/Marca.html',title:'Marca',x:1280,y:0,w:880,h:1080},{src:'./artboards/Fundamentos.html',title:'Fundamentos',x:1280,y:1240,w:880,h:1050},{src:'./artboards/Componentes.html',title:'Componentes',x:2240,y:0,w:880,h:1160}];document.title=TITLE;const world=document.getElementById('world'),viewport=document.getElementById('viewport'),zoomLabel=document.getElementById('zoom-label');let scale=1,tx=0,ty=0;for(const ab of ARTBOARDS){const el=document.createElement('div');el.className='artboard';el.style.left=ab.x+'px';el.style.top=ab.y+'px';el.style.width=ab.w+'px';const title=document.createElement('div');title.className='title';title.textContent=ab.title;const frame=document.createElement('div');frame.className='frame';frame.style.width=ab.w+'px';frame.style.height=ab.h+'px';const iframe=document.createElement('iframe');iframe.src=ab.src;iframe.title=ab.title;frame.appendChild(iframe);el.append(title,frame);el.addEventListener('dblclick',()=>window.open(ab.src,'_blank'));world.appendChild(el)}function apply(){world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;zoomLabel.textContent=Math.round(scale*100)+'%'}function zoomAt(cx,cy,factor){const next=Math.min(3,Math.max(.05,scale*factor));tx=cx-(cx-tx)*(next/scale);ty=cy-(cy-ty)*(next/scale);scale=next;apply()}function fit(){const pad=60,maxX=Math.max(...ARTBOARDS.map(a=>a.x+a.w)),maxY=Math.max(...ARTBOARDS.map(a=>a.y+a.h+24)),minX=Math.min(...ARTBOARDS.map(a=>a.x)),minY=Math.min(...ARTBOARDS.map(a=>a.y));scale=Math.min((innerWidth-pad*2)/(maxX-minX),(innerHeight-pad*2)/(maxY-minY),1);tx=pad-minX*scale+(innerWidth-pad*2-(maxX-minX)*scale)/2;ty=pad-minY*scale;apply()}viewport.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey||e.metaKey)zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.01));else{tx-=e.deltaX;ty-=e.deltaY;apply()}},{passive:false});let panning=false,px=0,py=0;viewport.addEventListener('pointerdown',e=>{if(e.target.closest('.artboard'))return;panning=true;px=e.clientX;py=e.clientY;viewport.classList.add('panning');viewport.setPointerCapture(e.pointerId)});viewport.addEventListener('pointermove',e=>{if(!panning)return;tx+=e.clientX-px;ty+=e.clientY-py;px=e.clientX;py=e.clientY;apply()});viewport.addEventListener('pointerup',()=>{panning=false;viewport.classList.remove('panning')});document.getElementById('zoom-in').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1.2);document.getElementById('zoom-out').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1/1.2);document.getElementById('zoom-fit').onclick=fit;document.getElementById('zoom-100').onclick=()=>{scale=1;apply()};addEventListener('resize',fit);fit()</script></body></html>
